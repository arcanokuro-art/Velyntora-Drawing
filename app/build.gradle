plugins { id 'com.android.application' }

android {
    namespace 'app.velyntora'
    compileSdk 36
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    defaultConfig {
        applicationId 'app.velyntora.drawing'
        minSdk 26
        targetSdk 36
        versionCode 19
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionName '1.0.0'
    }
}

dependencies { implementation project(':drawing-engine'); androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }
