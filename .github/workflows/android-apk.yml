name: Android piloto
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug :app:lintDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk Velyntora-Drawing-pilot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Velyntora-Drawing-pilot
          path: Velyntora-Drawing-pilot.apk
          if-no-files-found: error
      - name: Publicar APK piloto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pilot-latest >/dev/null 2>&1 || gh release create pilot-latest --title "Velyntora Drawing · Piloto" --notes "Prototipo de la pantalla de inicio para pruebas en Android. Nombre bajo el icono: V-Drawing." --prerelease
          gh release upload pilot-latest Velyntora-Drawing-pilot.apk --clobber
