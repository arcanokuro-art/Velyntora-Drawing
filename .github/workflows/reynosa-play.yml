name: Reynosa Android App Bundle
on:
  push:
    branches: [codex/reynosa-play]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Validar los límites del motor
        run: python engine/scripts/check_modular_boundaries.py
      - name: Compilar Reynosa para Android 16
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'ndk;28.2.13676358' 'build-tools;36.0.0'
          gradle :app:bundleRelease :app:assembleRelease :app:lintRelease --stacktrace
      - name: Verificar la alineación de 16 KB
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release-unsigned.apk
          python - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          from tempfile import TemporaryDirectory
          from zipfile import ZipFile

          with ZipFile('app/build/outputs/bundle/release/app-release.aab') as bundle, TemporaryDirectory() as directory:
              libraries = [name for name in bundle.namelist() if name.endswith('.so') and '/lib/' in name]
              assert any('/arm64-v8a/' in name for name in libraries), 'Faltan bibliotecas ARM64'
              for name in libraries:
                  if not any('/' + abi + '/' in name for abi in ('arm64-v8a', 'x86_64')):
                      continue
                  library = Path(bundle.extract(name, directory))
                  segments = [line.split() for line in check_output(['readelf', '-lW', library], text=True).splitlines()]
                  alignments = [int(segment[-1], 16) for segment in segments if segment and segment[0] == 'LOAD']
                  assert alignments and min(alignments) >= 16384, f'Alineación ELF incompatible: {name}'
                  print(name, 'OK')
          PY
      - name: Firmar el AAB con la clave existente de Drawing
        env:
          DRAWING_ANDROID_KEYSTORE_BASE64: ${{ secrets.DRAWING_ANDROID_KEYSTORE_BASE64 }}
          DRAWING_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DRAWING_ANDROID_KEYSTORE_PASSWORD }}
          DRAWING_ANDROID_CERT_SHA256: ${{ vars.DRAWING_ANDROID_CERT_SHA256 }}
        run: |
          umask 077
          keystore=$(mktemp)
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$DRAWING_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          fingerprint=$(keytool -exportcert -keystore "$keystore" -storetype PKCS12 -alias drawing -storepass:env DRAWING_ANDROID_KEYSTORE_PASSWORD | sha256sum | cut -d ' ' -f 1)
          expected=$(printf '%s' "$DRAWING_ANDROID_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [[ "$fingerprint" == "$expected" ]]
          jarsigner -keystore "$keystore" -storetype PKCS12 -storepass:env DRAWING_ANDROID_KEYSTORE_PASSWORD \
            -signedjar Velyntora-Drawing-1.0.0-Reynosa.aab app/build/outputs/bundle/release/app-release.aab drawing
          jarsigner -verify Velyntora-Drawing-1.0.0-Reynosa.aab
      - name: Firmar y verificar el APK instalable de Reynosa
        env:
          DRAWING_ANDROID_KEYSTORE_BASE64: ${{ secrets.DRAWING_ANDROID_KEYSTORE_BASE64 }}
          DRAWING_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DRAWING_ANDROID_KEYSTORE_PASSWORD }}
          DRAWING_ANDROID_CERT_SHA256: ${{ vars.DRAWING_ANDROID_CERT_SHA256 }}
        run: |
          bash .github/scripts/sign-android-pilot.sh app/build/outputs/apk/release/app-release-unsigned.apk Velyntora-Drawing-1.0.0-Reynosa.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose Velyntora-Drawing-1.0.0-Reynosa.apk
      - name: Publicar descarga instalable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0-reynosa >/dev/null 2>&1 || gh release create v1.0.0-reynosa --target "$GITHUB_SHA" --title "Velyntora Drawing 1.0.0 · Reynosa" --notes "Versión 1.0.0 Reynosa para revisión en Android. Incluye APK instalable y AAB para Play Console."
          gh release upload v1.0.0-reynosa Velyntora-Drawing-1.0.0-Reynosa.apk Velyntora-Drawing-1.0.0-Reynosa.aab --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Velyntora-Drawing-1.0.0-Reynosa
          path: |
            Velyntora-Drawing-1.0.0-Reynosa.aab
            Velyntora-Drawing-1.0.0-Reynosa.apk
            app/src/main/res/drawable-nodpi/ic_velyntora_drawing.png
          if-no-files-found: error
