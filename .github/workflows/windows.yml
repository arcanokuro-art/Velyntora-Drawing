name: Windows x64
on:
  push:
    branches: [windows, codex/windows-android-design]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
    steps:
      - shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - shell: pwsh
        run: Add-Content $env:GITHUB_PATH 'C:\msys64\mingw64\bin'
      - name: Verificar motor y separación modular
        run: python engine/scripts/check_modular_boundaries.py
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            windows/build/input/migan_pipeline_v2.onnx
          key: windows-desktop-${{ hashFiles('windows/pom.xml') }}-migan-v2
      - name: Dependencias de escritorio y modelo MI-GAN verificado
        shell: pwsh
        run: windows/scripts/dependencies.ps1
      - name: Compilar, probar y empaquetar Windows
        shell: pwsh
        run: windows/scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Velyntora-Drawing-Windows-x64
          path: windows/build/Velyntora-Drawing-Windows-x64.zip
          if-no-files-found: error
      - name: Publicar piloto Windows
        if: github.ref == 'refs/heads/windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-pilot *> $null
          if ($LASTEXITCODE -ne 0) { gh release create windows-pilot --target windows --title 'Velyntora Drawing · Piloto Windows x64' --notes 'Extrae todo el ZIP y ejecuta V-Drawing.exe. Incluye su entorno Java y el motor C++ original. Piloto de escritorio; consulta windows/README.md para el alcance.' --prerelease }
          $source = git rev-parse HEAD
          $notes = Join-Path $env:RUNNER_TEMP 'windows-release-notes.md'
          @("Velyntora Drawing 0.4.0 para Windows x64.", "", "Incluye MI-GAN sin conexión, formatos, objetos editables, efectos y herramientas de Core; selector HSV/RGBA, paleta completa, iconos originales, miniaturas y operaciones en segundo plano.", "Extrae todo el ZIP y abre V-Drawing.exe.", "", "Fuente comprobada: https://github.com/${{ github.repository }}/commit/$source", "La presión de tableta requiere validación física con el dispositivo.") | Set-Content -Encoding utf8 $notes
          gh release edit windows-pilot --notes-file $notes
          gh api "repos/${{ github.repository }}/git/refs/tags/windows-pilot" --method PATCH -f "sha=$source" -F force=true
          if ($LASTEXITCODE -ne 0) { throw 'Windows release source update failed' }
          gh release upload windows-pilot windows/build/Velyntora-Drawing-Windows-x64.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Windows publication failed' }
